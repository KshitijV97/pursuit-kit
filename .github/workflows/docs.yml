name: Docs

on:
  pull_request:
    paths:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mermaid:
    name: Mermaid syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # mermaid-cli renders each diagram with headless Chromium, which downloads on install.
      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      # mermaid-cli drives headless Chromium. GitHub's Ubuntu images disable unprivileged user
      # namespaces, so Chromium needs the sandbox off in this throwaway runner.
      - name: Write a Puppeteer config
        run: echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"

      - name: Render every Mermaid diagram in docs/
        env:
          MMDC_PUPPETEER_CONFIG: ${{ runner.temp }}/puppeteer.json
        run: node scripts/check-mermaid.ts docs
