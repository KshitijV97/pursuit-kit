name: Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    name: Regression pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: |
          npm install -g corepack@latest
          corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Doc service tests with real Tectonic
        run: make doc-service-test

      - name: End-to-end, keyboard and no-JavaScript checks with axe
        run: make e2e

      - name: Page-weight budgets
        run: make budget

      - name: Unused code and dependencies
        run: make knip

      - name: Dependency audit
        run: make audit

  report-failure:
    name: Open or update the regression issue
    needs: regression
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report the failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The regression pack failed on `main`.",
              "",
              `- Commit: ${context.sha}`,
              `- Run: ${runUrl}`,
              "",
              "Releases stay blocked until this is fixed and `main` passes again.",
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: "regression",
              state: "open",
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Regression pack failed",
                labels: ["regression"],
                body,
              });
            }
